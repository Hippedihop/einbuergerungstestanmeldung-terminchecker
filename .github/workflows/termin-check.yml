name: Einbürgerungstest Terminchecker

on:
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Test-Alarm senden"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright installieren
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Einbürgerungstest-Termine prüfen
        id: termin
        env:
          TEST_ALARM: ${{ inputs.test_alarm }}
        run: |
          if [ "$TEST_ALARM" = "true" ]; then
            echo "Manueller Test-Alarm."
            echo "status=AVAILABLE" >> "$GITHUB_OUTPUT"
            echo "final_url=TEST-ALARM" >> "$GITHUB_OUTPUT"
          else
            node check.mjs
          fi

      - name: Benachrichtigung senden
        if: steps.termin.outputs.status == 'AVAILABLE'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ALARM: ${{ inputs.test_alarm }}
        run: |
          issue=$(gh issue list \
            --state open \
            --search '"Einbürgerungstest: Termin-Alarm" in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [ "$TEST_ALARM" = "true" ]; then
            message="🧪 TEST-ALARM

          Das ist nur ein Test der Benachrichtigung.

          Wenn du hierfür eine E-Mail bekommst, funktioniert die Alarmierung."
          else
            message="🚨 TERMIN VERFÜGBAR

          Der automatische Checker hat gerade buchbare Termine gefunden.

          Ergebnis:
          ${{ steps.termin.outputs.final_url }}

          Jetzt sofort prüfen:
          https://service.berlin.de/dienstleistung/351180/standort/351435/

          Der Checker läuft weiter und prüft wieder in etwa 10 Minuten."
          fi

          if [ -z "$issue" ]; then
            gh issue create \
              --title "🚨 Einbürgerungstest: Termin-Alarm" \
              --body "$message"
          else
            gh issue comment "$issue" \
              --body "$message"
          fi
