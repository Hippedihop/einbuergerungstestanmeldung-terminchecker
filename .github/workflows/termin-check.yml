name: Einbürgerungstest Terminchecker

on:
  # Manuell über "Run workflow" startbar
  workflow_dispatch:

  # Automatisch alle 10 Minuten
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright installieren
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Einbürgerungstest-Termine prüfen
        id: termin
        run: node check.mjs

      # -------------------------------------------------------
      # TERMIN VORHANDEN
      # -------------------------------------------------------
      - name: Alarm bei verfügbarem Termin
        if: steps.termin.outputs.status == 'AVAILABLE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list \
            --state open \
            --search '"TERMIN VERFÜGBAR" in:title' \
            --json number \
            --jq '.[0].number')

          if [ -z "$issue" ]; then

            echo "Termin gefunden - neues Alarm-Issue wird erstellt."

            gh issue create \
              --title "🚨 TERMIN VERFÜGBAR – Einbürgerungstest" \
              --body "🚨 **TERMIN GEFUNDEN**

          Der automatische Checker hat buchbare Termine beim ServicePortal Berlin erkannt.

          Ergebnis:
          ${{ steps.termin.outputs.final_url }}

          **Jetzt sofort prüfen:**
          https://service.berlin.de/dienstleistung/351180/standort/351435/

          Der Checker läuft weiterhin automatisch alle 10 Minuten."

          else

            echo "Termin weiterhin vorhanden - erneute Benachrichtigung."

            gh issue comment "$issue" \
              --body "🚨 **TERMIN WEITERHIN VERFÜGBAR**

          Der automatische 10-Minuten-Check hat erneut einen verfügbaren Termin erkannt.

          Ergebnis:
          ${{ steps.termin.outputs.final_url }}

          **Jetzt sofort prüfen:**
          https://service.berlin.de/dienstleistung/351180/standort/351435/

          Der Checker läuft weiter und prüft in etwa 10 Minuten erneut."

          fi

      # -------------------------------------------------------
      # KEINE TERMINE VORHANDEN
      # -------------------------------------------------------
      - name: Alarm zurücksetzen
        if: steps.termin.outputs.status == 'NONE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issues=$(gh issue list \
            --state open \
            --search '"TERMIN VERFÜGBAR" in:title' \
            --json number \
            --jq '.[].number')

          for issue in $issues; do
            echo "Keine Termine mehr vorhanden - Alarm #$issue wird zurückgesetzt."
            gh issue close "$issue"
          done
